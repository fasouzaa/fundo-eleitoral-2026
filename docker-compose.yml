services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Dev alternativo: hot reload (sem rebuild da imagem de produção)
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  web_node_modules:
