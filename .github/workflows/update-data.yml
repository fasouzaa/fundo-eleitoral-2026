name: Atualizar dados FEFC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tentar download e processar TSE
        id: etl
        continue-on-error: true
        run: |
          set -euo pipefail
          python etl/build_dataset.py --download
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Aviso se CDN bloqueou (comum em Actions)
        if: steps.etl.outcome == 'failure'
        run: |
          echo "::warning::CDN do TSE (Akamai) costuma bloquear IPs do GitHub Actions (HTTP 403)."
          echo "Atualize localmente com: python etl/build_dataset.py --download"
          echo "No Windows, BITS costuma funcionar. Depois faça commit/push de web/public/data."
          test -f web/public/data/summary.json
          echo "Dados já commitados no repo permanecem válidos."

      - name: Commit e push se houver mudança
        if: steps.etl.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed web/public/data
          if git diff --staged --quiet; then
            echo "Sem alteração nos dados."
          else
            git commit -m "chore: atualiza dados FEFC do TSE"
            git push
          fi
